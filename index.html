<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisenziya Generatoru — Cbt1</title>
<style>
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e6e6e6;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
    .box{background:#1a1d24;border-radius:24px;padding:32px 24px;max-width:420px;width:100%}
    h1{font-size:1.3rem;margin:0 0 20px;text-align:center}
    label{display:block;font-size:0.85rem;color:#9aa0aa;margin:16px 0 6px}
    input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:14px;border:1px solid #333;background:#0f1115;color:#fff;font-size:1rem}
    button{width:100%;margin-top:20px;padding:14px;border:none;border-radius:14px;background:#2b7a4b;color:#fff;font-weight:600;font-size:1rem;cursor:pointer}
    button:hover{background:#256b41}
    .result{margin-top:20px;padding:16px;background:#0f1115;border-radius:14px;border:1px solid #2b7a4b;display:none}
    .result code{font-size:1.05rem;color:#7fd99a;word-break:break-all}
    .copy-btn{margin-top:10px;background:#333;font-weight:500}
    .lock{text-align:center;padding:40px 0}
    .lock input{text-align:center;letter-spacing:3px}
    .err{color:#e05252;font-size:0.85rem;margin-top:8px;display:none;text-align:center}
</style>
</head>
<body>

<div class="box" id="pinBox">
    <h1>🔒 Giriş PIN-i</h1>
    <div class="lock">
        <input type="password" id="pinInput" placeholder="PIN kodu" maxlength="12">
        <button id="pinBtn">Daxil ol</button>
        <div class="err" id="pinErr">PIN yanlışdır</div>
    </div>
</div>

<div class="box" id="genBox" style="display:none">
    <h1>Cbt1 — Lisenziya Generatoru</h1>

    <label>Lisenziya növü</label>
    <select id="licType">
        <option value="L">Birdəfəlik (ömürlük)</option>
        <option value="6">6 aylıq</option>
        <option value="1">1 illik</option>
    </select>

    <button id="genBtn">Lisenziya yarat</button>

    <div class="result" id="result">
        <div style="font-size:0.8rem;color:#9aa0aa;margin-bottom:6px">Lisenziya kodu:</div>
        <code id="licCode"></code>
        <div style="font-size:0.8rem;color:#9aa0aa;margin-top:10px" id="licExpiry"></div>
        <button class="copy-btn" id="copyBtn">Kopyala</button>
    </div>
</div>

<script>
// Bu PIN yalnız generatora təsadüfi girişin qarşısını alır, kriptoqrafik qoruma deyil
const ADMIN_PIN = "AL2026EA";

const PIN_STORAGE_KEY = "lisenziya_gen_pin_ok";
if (sessionStorage.getItem(PIN_STORAGE_KEY) === "1") {
    document.getElementById("pinBox").style.display = "none";
    document.getElementById("genBox").style.display = "block";
}

document.getElementById("pinBtn").onclick = function () {
    const val = document.getElementById("pinInput").value.trim().toUpperCase();
    if (val === ADMIN_PIN) {
        sessionStorage.setItem(PIN_STORAGE_KEY, "1");
        document.getElementById("pinBox").style.display = "none";
        document.getElementById("genBox").style.display = "block";
    } else {
        document.getElementById("pinErr").style.display = "block";
    }
};

// --- Lisenziya məntiqi: Cbt1-in öz yoxlama koduyla eyni olmalıdır ---
const LICENSE_SALT = "AN-CBT1-2026-SALT";

function computeChecksum(type, expiry) {
    const str = type + expiry + LICENSE_SALT;
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    }
    return hash.toString(36).toUpperCase().padStart(6, "0").slice(0, 6);
}

function formatDate(d) {
    return d.toISOString().slice(0, 10).replace(/-/g, "");
}

function generateLicense(type) {
    let expiry;
    if (type === "L") {
        expiry = "99991231";
    } else {
        const months = type === "6" ? 6 : 12;
        const d = new Date();
        d.setMonth(d.getMonth() + months);
        expiry = formatDate(d);
    }
    const checksum = computeChecksum(type, expiry);
    return { code: `LIC-${type}-${expiry}-${checksum}`, expiry };
}

function humanExpiry(type, expiry) {
    if (type === "L") return "Bitmə tarixi yoxdur (ömürlük)";
    const y = expiry.slice(0, 4), m = expiry.slice(4, 6), d = expiry.slice(6, 8);
    return `Bitmə tarixi: ${d}.${m}.${y}`;
}

document.getElementById("genBtn").onclick = function () {
    const type = document.getElementById("licType").value;
    const { code, expiry } = generateLicense(type);
    document.getElementById("licCode").textContent = code;
    document.getElementById("licExpiry").textContent = humanExpiry(type, expiry);
    document.getElementById("result").style.display = "block";
};

document.getElementById("copyBtn").onclick = function () {
    const code = document.getElementById("licCode").textContent;
    navigator.clipboard.writeText(code).then(() => {
        this.textContent = "Kopyalandı ✓";
        setTimeout(() => (this.textContent = "Kopyala"), 1500);
    });
};
</script>
</body>
</html>
