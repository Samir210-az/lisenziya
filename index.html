<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisenziya Generator — AN</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b7a4b">
<link rel="icon" href="icon-192.png">
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
  .box{background:#1a1d24;border-radius:20px;padding:30px;max-width:440px;width:100%}
  h1{font-size:1.3rem;margin-top:0;text-align:center}
  label{display:block;font-size:0.85rem;color:#9aa0aa;margin:16px 0 6px}
  input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#0f1115;color:#eee;font-size:1rem}
  button{background:#2b7a4b;border:none;font-weight:bold;cursor:pointer}
  button:hover{background:#256b41}
  .result{background:#0f1115;border:1px solid #2b7a4b;border-radius:12px;padding:16px;margin-top:15px;display:none;text-align:center}
  .result code{font-size:1.1rem;color:#7fd99a;word-break:break-all}
  .copy-btn{margin-top:10px;background:#333;font-weight:500}
  .hint{font-size:0.8rem;color:#9aa0aa;margin-top:8px}
  .err{color:#e05252;font-size:0.85rem;margin-top:8px;display:none;text-align:center}
  #tool{display:none}
</style>
</head>
<body>

<div class="box" id="gate">
  <h1>🔒 Giriş</h1>
  <input type="password" id="pinInput" placeholder="Admin PIN" maxlength="12">
  <button id="pinBtn">Daxil ol</button>
  <div class="err" id="pinError">PIN yanlışdır</div>
</div>

<div class="box" id="tool">
  <h1>Lisenziya Generatoru</h1>
  <label>Məhsul</label>
  <select id="productSelect">
    <option value="CBT1">Cbt1</option>
    <option value="AITEST">ai-test</option>
  </select>
  <label>Lisenziya növü</label>
  <select id="tierSelect">
    <option value="1M">1 aylıq</option>
    <option value="6M">6 aylıq</option>
    <option value="1Y">1 illik</option>
  </select>
  <button id="genBtn">Lisenziya yarat</button>
  <div class="result" id="resultBox">
    <div style="font-size:0.8rem;color:#9aa0aa;margin-bottom:6px">Lisenziya kodu:</div>
    <code id="licCode"></code>
    <div class="hint" id="expiryHint"></div>
    <button class="copy-btn" id="copyBtn">Kopyala</button>
  </div>
</div>

<script>
const ADMIN_PIN = "AL2026EA";
const SALTS = { CBT1: "AN-CBT1-2026", AITEST: "AN-AITEST-2026" };
const DURATIONS = { "1M": 30, "6M": 182, "1Y": 365 };
const PIN_STORAGE_KEY = "lisenziya_gen_pin_ok";

function computeChecksum(tier, days, salt) {
  const str = tier + "-" + days + "-" + salt;
  let sum = 0;
  for (let i = 0; i < str.length; i++) sum = (sum * 31 + str.charCodeAt(i)) >>> 0;
  return sum.toString(36).toUpperCase().padStart(4, "0").slice(-4);
}

function generateCode(product, tier) {
  const salt = SALTS[product];
  const days = Math.floor(Date.now() / 86400000) + DURATIONS[tier];
  const daysB36 = days.toString(36).toUpperCase();
  const checksum = computeChecksum(tier, days, salt);
  return { code: `LIC-${tier}-${daysB36}-${checksum}`, expiryDate: new Date(days * 86400000) };
}

if (sessionStorage.getItem(PIN_STORAGE_KEY) === "1") {
  document.getElementById("gate").style.display = "none";
  document.getElementById("tool").style.display = "block";
}

document.getElementById("pinBtn").onclick = function() {
  if (document.getElementById("pinInput").value.trim().toUpperCase() === ADMIN_PIN) {
    sessionStorage.setItem(PIN_STORAGE_KEY, "1");
    document.getElementById("gate").style.display = "none";
    document.getElementById("tool").style.display = "block";
  } else {
    document.getElementById("pinError").style.display = "block";
  }
};

document.getElementById("genBtn").onclick = function() {
  const product = document.getElementById("productSelect").value;
  const tier = document.getElementById("tierSelect").value;
  const { code, expiryDate } = generateCode(product, tier);
  document.getElementById("licCode").textContent = code;
  document.getElementById("expiryHint").textContent = "Bitmə tarixi: " + expiryDate.toLocaleDateString("az-AZ");
  document.getElementById("resultBox").style.display = "block";
};

document.getElementById("copyBtn").onclick = function() {
  navigator.clipboard.writeText(document.getElementById("licCode").textContent).then(() => {
    this.textContent = "Kopyalandı ✓";
    setTimeout(() => (this.textContent = "Kopyala"), 1500);
  });
};

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
